<!DOCTYPE html>
<html>
<head>
    <title>2473004-Shelma Septiani</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        table {
            margin-top: 10px;
        }
        hr {
            border: 0;
            border-top: 1px solid #000;
            margin: 5px 0;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <table border="1" cellpadding="0" cellspacing="0">
        <tr>
            <td width="50" align="center">
                <input class="header" type="checkbox"/><br/>
                <hr/>
                <input class="body" type="checkbox"/><br/>
                <input class="body" type="checkbox"/><br/>
                <input class="body" type="checkbox"/><br/>
                <input class="body" type="checkbox"/><br/>
                <input class="body" type="checkbox"/><br/>
            </td>
        </tr>
    </table>

    <script>
        $(document).ready(function() {
            
            $(".header").click(function() {
                
                var isChecked = $(this).prop("checked");

                if (isChecked) {
                    $("input:checkbox.body").prop("checked", true);
                } else {
                    $("input:checkbox.body").prop("checked", false);
                }

                var jumlahTerpilih = $("input:checkbox.body:checked").length;
                console.log("Jumlah checkbox terpilih: " + jumlahTerpilih);
            });

            $(".body").click(function() {
                if ($(".body:checked").length === $(".body").length) {
                    $(".header").prop("checked", true);
                } else {
                    $(".header").prop("checked", false);
                }
            });

        });
    </script>

</body>
</html>
