<!DOCTYPE html>
<html>
<head>
    <title>2473004-Shelma Septiani</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 50px;
            background-color: #f0f0f0;
        }

        .search-box {
            width: 350px;
            background: linear-gradient(to bottom, #ffffff 0%, #e0e0e0 100%);
            padding: 20px;
            border: 1px solid #ccc;
            box-shadow: 10px 10px 20px rgba(0,0,0,0.3);
            border-radius: 4px;
        }

        #txtCari {
            width: 250px;
            padding: 5px;
            margin-bottom: 20px;
            border: 1px solid #999;
        }

        .daftar-it div {
            padding: 3px 0;
            font-size: 14px;
            color: #333;
            transition: color 0.2s;
        }

        .text-merah {
            color: red !important;
            font-weight: bold;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <div class="search-box">
        <input type="text" id="txtCari" placeholder="">

        <div class="daftar-it">
            <div>Sun Microsystem</div>
            <div>Apache Software Foundation</div>
            <div>Oracle Coorporation</div>
            <div>International Bussiness Machines</div>
            <div>Microsoft Coorporation</div>
            <div>Apple Inc</div>
            <div>Sap Ag</div>
            <div>Accenture</div>
            <div>Computer Sciences Coorporation</div>
            <div>Google</div>
            <div>Softbank</div>
            <div>Yahoo</div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            
            $("#txtCari").on("keyup", function() {
                var value = $(this).val().toLowerCase();

                $(".daftar-it div").removeClass("text-merah");

                if (value !== "") {
                    $(".daftar-it div").each(function() {
                        var textItem = $(this).text().toLowerCase();
                        
                        if (textItem.indexOf(value) > -1) {
                            $(this).addClass("text-merah");
                        }
                    });
                }
            });

        });
    </script>

</body>
</html>
